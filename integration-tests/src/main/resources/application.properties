# Random ports: the test port is handed to the browser tests through @TestHTTPResource.
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0
# The default datasource is not used.
quarkus.datasource.devservices.enabled=false
# The test database: env QUARKPRESS_TEST_DB in test JVMs; -DtestDb (a Maven system property) while Maven builds the app.
quarkus.datasource."quarkpress".db-kind=${QUARKPRESS_TEST_DB:${testDb:postgresql}}
# A network: the multisite module's own configuration already turns it on; it is stated here because the tests depend
# on the network's shape (sites in subdirectories of localhost serve their own REST API and admin screens). The main
# site, localhost at /, comes from the persistence migrations.
quarkpress.multisite.enabled=true
# Dev Services for Keycloak imports this application's own realm, quarkpress-admin-dev-realm.json: the security
# module's dev realm (realm quarkpress, users alice, bob, carol, dave and erin, each with their user name as password,
# the confidential client quarkus-app with secret "secret") plus the public client quarkpress-admin the admin shell
# signs in with (authorization code with PKCE, any redirect URI). A dev-only fixture: its users, passwords and
# wildcard redirect URIs must never be used outside Dev Services. The realm name comes from the security module.
quarkus.keycloak.devservices.realm-path=quarkpress-admin-dev-realm.json
# alice, the realm's network administrator, is made one at every start.
quarkpress.security.initial-super-admins=a11ce000-0000-4000-8000-000000000001
# The admin screens need no setting: they live under each site's /wp-admin/ and sign in against the application's own
# OIDC server (quarkus.oidc.auth-server-url, set by Dev Services) as the client quarkpress-admin.
# Nothing here waits for scheduled posts: the scheduler stays off.
quarkus.scheduler.enabled=false
# The filesystem storage keeps the uploads in the build folder and its route serves them under /wp-content/uploads.
quarkpress.media.fs.directory=target/media-files
# Keycloak can take more than the default minute to start on shared CI runners.
quarkus.devservices.timeout=5M
