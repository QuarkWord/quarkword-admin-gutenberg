name: Native

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'runtime/**'
      - 'deployment/**'
      - 'integration-tests/**'
      - 'pom.xml'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native / ${{ matrix.db }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        db: [postgresql, mysql]
    steps:
      - uses: actions/checkout@v4
      # Read with sed, not Maven: the parent POM imports quarkword-bom, which is not installed yet.
      - name: Read the pins
        run: |
          echo "QUARKWORD_COMMIT=$(sed -n 's:.*<quarkword.commit>\(.*\)</quarkword.commit>.*:\1:p' pom.xml)" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_VERSION=$(sed -n 's:.*<playwright.version>\(.*\)</playwright.version>.*:\1:p' pom.xml)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: QuarkWord/quarkword
          ref: ${{ env.QUARKWORD_COMMIT }}
          path: .quarkword
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install the QuarkWord modules at the pinned commit
        working-directory: .quarkword
        run: mvn -B -ntp install -DskipTests -pl bom,extensions/rest-wp-v2/deployment,extensions/multisite/deployment,extensions/security/deployment,extensions/posts/deployment,extensions/taxonomy/deployment,extensions/revisions/deployment,extensions/scheduling/deployment,extensions/media/deployment,extensions/media-storage-fs/deployment,extensions/media-image-imageio/deployment,extensions/blocks/deployment,extensions/outbound/deployment -am
      - name: Install the admin modules
        run: mvn -B -ntp install -DskipTests -pl runtime,deployment -am
      - name: Cache Playwright's browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright's Chromium
        run: mvn -B -ntp -pl integration-tests exec:java -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"
      # quarkus-awt (media): the native executable loads the AWT shared libraries copied next to it, which
      # need FreeType and fontconfig on the host that runs it. Usually preinstalled on ubuntu-latest; made explicit here.
      - name: Install the AWT runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libfreetype6 fontconfig
      # No -am: the step above installed runtime and deployment, so their unit tests do not run again here. The last
      # line fails the step when the smoke flow was renamed, filtered out or skipped.
      - name: Build the native executable and run the integration tests
        run: |
          mvn -B -ntp -T1 verify -fae -Dnative -Dquarkus.native.container-build=true \
            -Dquarkus.native.builder-image=mandrel -DskipUnitTests=true \
            -Dquarkus.native.additional-build-args=-J-XX:TieredStopAtLevel=1,--parallelism=8 \
            -DtestDb=${{ matrix.db }} -pl integration-tests
          bash .github/scripts/require-tests-ran.sh integration-tests/target/failsafe-reports/TEST-org.quarkword.it.admin.AdminSmokeIT.xml
